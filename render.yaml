# Render Blueprint. Ang mga may sync: false ay ilalagay mo mismo sa dashboard (tingnan ang DEPLOY.md).
services:
  - type: web
    name: lost-found-log
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: cd backend && gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /api/items/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DRF_NUM_PROXIES
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_SECRET_KEY
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: OSAS_USERNAME
        sync: false
      - key: OSAS_PASSWORD
        sync: false
